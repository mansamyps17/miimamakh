<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធវិក្កយបត្រ (Invoice System)</title>
    <!-- ប្រើ html2canvas ដើម្បីទាញយករូបភាព PNG -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Khmer OS Siemreap', 'Segoe UI', sans-serif; }
        body { background: #f4f4f4; padding: 20px; display: flex; justify-content: center; }
        .invoice-wrapper { width: 100%; max-width: 900px; }
        .invoice-container { background: #fff; padding: 30px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        
        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #2e7d32; padding-bottom: 20px; margin-bottom: 20px; }
        .logo-box { width: 250px; height: 100px; border: 2px dashed #ccc; display: flex; align-items: center; justify-content: center; color: #888; }
        .title { color: #2e7d32; font-size: 28px; font-weight: bold; }

        /* Info Section */
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-bottom: 20px; }
        .info-group { display: flex; align-items: center; margin-bottom: 10px; }
        .info-group label { width: 100px; font-size: 14px; }
        .info-group input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; outline: none; }

        /* Table */
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th { background: #2e7d32; color: white; padding: 10px; text-align: left; font-size: 14px; }
        td { padding: 8px; border-bottom: 1px solid #ddd; }
        td input { width: 100%; padding: 6px; border: 1px solid #ccc; border-radius: 4px; outline: none; }
        .btn-add { background: #2e7d32; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; margin-bottom: 10px; }
        .btn-del { background: #d32f2f; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; }

        /* Footer / Totals */
        .footer-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-top: 20px; }
        .qr-box { width: 150px; height: 150px; border: 2px dashed #ccc; display: flex; align-items: center; justify-content: center; color: #888; }
        .totals .total-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 15px; }
        .totals .total-row input { width: 120px; padding: 6px; text-align: right; border: 1px solid #ccc; border-radius: 4px; }
        .grand-total { color: #2e7d32; font-weight: bold; font-size: 18px; }

        /* Action Buttons */
        .action-buttons { display: flex; gap: 10px; margin-top: 20px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 5px; color: white; font-size: 16px; cursor: pointer; font-weight: bold; }
        .btn-print { background: #2e7d32; }
        .btn-png { background: #0288d1; }
        .btn-clear { background: #d32f2f; flex: 0.5; }

        /* Hide specific elements when printing */
        @media print {
            body { padding: 0; background: #fff; }
            .invoice-wrapper { box-shadow: none; max-width: 100%; }
            .action-buttons, .btn-add, .btn-del { display: none !important; }
            td input, .info-group input, .total-row input { border: none; background: transparent; padding: 0; }
        }
    </style>
</head>
<body>

<div class="invoice-wrapper">
    <!-- Invoice Content -->
    <div class="invoice-container" id="invoice-content">
        <div class="header">
            <div class="logo-box">+ ដាក់ Logo</div>
            <div class="title">វិក្កយបត្រ (INVOICE)</div>
        </div>

        <div class="info-grid">
            <div>
                <div class="info-group"><label>អតិថិជន:</label><input type="text" id="inv_customer" oninput="saveData()"></div>
                <div class="info-group"><label>លេខទូរស័ព្ទ:</label><input type="text" id="inv_phone" oninput="saveData()"></div>
                <div class="info-group"><label>អាសយដ្ឋាន:</label><input type="text" id="inv_address" oninput="saveData()"></div>
            </div>
            <div>
                <div class="info-group"><label>វិក្កយបត្រលេខ:</label><input type="text" id="inv_no" oninput="saveData()"></div>
                <div class="info-group"><label>កាលបរិច្ឆេទ:</label><input type="date" id="inv_date" oninput="saveData()"></div>
            </div>
        </div>

        <button class="btn-add" onclick="addRow()">+ បន្ថែមទំនិញ</button>
        <table id="itemTable">
            <thead>
                <tr>
                    <th width="5%">ល.រ</th>
                    <th width="40%">បរិយាយ (Description)</th>
                    <th width="10%">ឯកតា</th>
                    <th width="10%">បរិមាណ</th>
                    <th width="15%">តម្លៃ ($)</th>
                    <th width="15%">តម្លៃសរុប</th>
                    <th width="5%">លុប</th>
                </tr>
            </thead>
            <tbody>
                <!-- Rows will be injected here by JS -->
            </tbody>
        </table>

        <div class="footer-grid">
            <div>
                <p style="font-size: 14px; font-weight: bold;">Scan Pay Here:</p>
                <div class="qr-box">+ ដាក់ QR</div>
            </div>
            <div class="totals">
                <div class="total-row"><span>សរុប (Sub Total):</span><span id="txt_subtotal">$ 0.00</span></div>
                <div class="total-row"><span>បញ្ចុះតម្លៃ (Discount):</span> <input type="number" id="inv_discount" value="0" oninput="calculateTotal(); saveData()"></div>
                <div class="total-row">
                    <label><input type="checkbox" id="inv_vat" onchange="calculateTotal(); saveData()"> អាករ (VAT 10%):</label>
                    <span id="txt_vat">$ 0.00</span>
                </div>
                <div class="total-row grand-total"><span>សរុបទាំងអស់ (Grand Total):</span><span id="txt_grandtotal">$ 0.00</span></div>
            </div>
        </div>
    </div>

    <!-- Action Buttons (Not included in PNG/PDF) -->
    <div class="action-buttons">
        <button class="btn btn-print" onclick="window.print()">🖨️ បោះពុម្ព / Save ជា PDF</button>
        <button class="btn btn-png" onclick="saveAsPNG()">🖼️ រក្សាទុកជារូបភាព (PNG)</button>
        <button class="btn btn-clear" onclick="clearData()">🧹 លុបទិន្នន័យ (វិក្កយបត្រថ្មី)</button>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", loadData);

    // ១. បន្ថែមជួរទំនិញ
    function addRow(desc = '', unit = '', qty = 1, price = 0) {
        const tbody = document.querySelector('#itemTable tbody');
        const tr = document.createElement('tr');
        
        tr.innerHTML = `
            <td class="row-num">1</td>
            <td><input type="text" class="desc" value="${desc}" oninput="saveData()"></td>
            <td><input type="text" class="unit" value="${unit}" oninput="saveData()"></td>
            <td><input type="number" class="qty" value="${qty}" oninput="calculateTotal(); saveData()"></td>
            <td><input type="number" class="price" value="${price}" oninput="calculateTotal(); saveData()"></td>
            <td class="row-total">$ 0.00</td>
            <td><button class="btn-del" onclick="removeRow(this)">X</button></td>
        `;
        tbody.appendChild(tr);
        updateRowNumbers();
        calculateTotal();
        saveData();
    }

    // ២. លុបជួរទំនិញ
    function removeRow(btn) {
        btn.closest('tr').remove();
        updateRowNumbers();
        calculateTotal();
        saveData();
    }

    // រៀបលំដាប់លេខរៀងឡើងវិញ
    function updateRowNumbers() {
        const rows = document.querySelectorAll('#itemTable tbody tr');
        rows.forEach((row, index) => {
            row.querySelector('.row-num').innerText = index + 1;
        });
    }

    // ៣. គណនាតម្លៃសរុប (Calculate)
    function calculateTotal() {
        let subtotal = 0;
        const rows = document.querySelectorAll('#itemTable tbody tr');
        
        rows.forEach(row => {
            const qty = parseFloat(row.querySelector('.qty').value) || 0;
            const price = parseFloat(row.querySelector('.price').value) || 0;
            const total = qty * price;
            row.querySelector('.row-total').innerText = '$ ' + total.toFixed(2);
            subtotal += total;
        });

        const discount = parseFloat(document.getElementById('inv_discount').value) || 0;
        const isVat = document.getElementById('inv_vat').checked;
        
        let subAfterDiscount = subtotal - discount;
        if(subAfterDiscount < 0) subAfterDiscount = 0;
        
        let vatAmount = isVat ? (subAfterDiscount * 0.1) : 0;
        let grandTotal = subAfterDiscount + vatAmount;

        document.getElementById('txt_subtotal').innerText = '$ ' + subtotal.toFixed(2);
        document.getElementById('txt_vat').innerText = '$ ' + vatAmount.toFixed(2);
        document.getElementById('txt_grandtotal').innerText = '$ ' + grandTotal.toFixed(2);
    }

    // ៤. រក្សាទុកទិន្នន័យ (Auto-Save to LocalStorage)
    function saveData() {
        // Save Inputs
        const ids = ['inv_customer', 'inv_phone', 'inv_address', 'inv_no', 'inv_date', 'inv_discount'];
        ids.forEach(id => localStorage.setItem(id, document.getElementById(id).value));
        localStorage.setItem('inv_vat', document.getElementById('inv_vat').checked);

        // Save Table Rows
        const rows = document.querySelectorAll('#itemTable tbody tr');
        const items = [];
        rows.forEach(row => {
            items.push({
                desc: row.querySelector('.desc').value,
                unit: row.querySelector('.unit').value,
                qty: row.querySelector('.qty').value,
                price: row.querySelector('.price').value
            });
        });
        localStorage.setItem('inv_items', JSON.stringify(items));
    }

    // ៥. ទាញទិន្នន័យមកវិញពេល Refresh (Load Data)
    function loadData() {
        // Load Inputs
        const ids = ['inv_customer', 'inv_phone', 'inv_address', 'inv_no', 'inv_date', 'inv_discount'];
        ids.forEach(id => {
            if (localStorage.getItem(id) !== null) document.getElementById(id).value = localStorage.getItem(id);
        });
        
        if (localStorage.getItem('inv_vat') === 'true') {
            document.getElementById('inv_vat').checked = true;
        }

        // Load Table Rows
        const savedItems = JSON.parse(localStorage.getItem('inv_items'));
        if (savedItems && savedItems.length > 0) {
            savedItems.forEach(item => addRow(item.desc, item.unit, item.qty, item.price));
        } else {
            addRow(); // ដាក់ជួរទទេមួយបើអត់មានទិន្នន័យចាស់
        }
    }

    // ៦. លុបទិន្នន័យដើម្បីសរសេរថ្មី (Clear Data)
    function clearData() {
        if(confirm("តើអ្នកពិតជាចង់លុបទិន្នន័យនេះចោល ដើម្បីបង្កើតវិក្កយបត្រថ្មីមែនទេ?")) {
            localStorage.clear();
            location.reload();
        }
    }

    // ៧. ទាញយកជារូបភាព PNG
    function saveAsPNG() {
        const invoiceEl = document.getElementById('invoice-content');
        html2canvas(invoiceEl, { scale: 2 }).then(canvas => {
            const link = document.createElement('a');
            const invNo = document.getElementById('inv_no').value || 'New';
            link.download = `Invoice_${invNo}.png`;
            link.href = canvas.toDataURL();
            link.click();
        });
    }
</script>
</body>
</html>
