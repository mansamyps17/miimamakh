<script>
document.addEventListener("DOMContentLoaded", function() {
    // ១. ពេលទំព័រលោតចេញមក (Load/Refresh) វាទាញទិន្នន័យចាស់មកបំពេញចូលប្រអប់វិញ
    const inputs = document.querySelectorAll("input, textarea, select");
    
    inputs.forEach(input => {
        // ត្រូវប្រាកដថាប្រអប់ input របស់អ្នកមាន id ត្រឹមត្រូវ (ឧ. id="customer_name")
        if (input.id) { 
            const savedValue = localStorage.getItem("inv_" + input.id);
            if (savedValue !== null) {
                if(input.type === 'checkbox' || input.type === 'radio') {
                    input.checked = savedValue === 'true';
                } else {
                    input.value = savedValue;
                }
            }
        }
    });

    // ប្រសិនបើអ្នកចង់គណនាតម្លៃឡើងវិញ (Subtotal/Total) ក្រោយពេលទាញទិន្នន័យរួច
    // សូមហៅ Function គណនារបស់អ្នកនៅទីនេះ ឧទាហរណ៍៖ calculateTotal();

    // ២. ចាប់យកការវាយបញ្ចូលរបស់អ្នក ហើយ Save ទុកភ្លាមៗ (Auto-save)
    document.body.addEventListener("input", function(e) {
        const el = e.target;
        // Save តែពេលមានការវាយបញ្ចូលក្នុងប្រអប់ Input, Textarea ឬ Select ប៉ុណ្ណោះ
        if (el.id && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT')) {
            const valueToSave = (el.type === 'checkbox' || el.type === 'radio') ? el.checked : el.value;
            localStorage.setItem("inv_" + el.id, valueToSave);
        }
    });
});
</script>
