<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <title>វិក្កយបត្រ (Tax Invoice)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- ផ្នែកខាងលើ -->
        <div class="inv-header-section no-print">
            <a href="index.html" class="back-link">← ត្រឡប់ក្រោយ</a>
        </div>

        <div class="invoice-box" id="invoice-content">
            <div class="inv-header">
                <div class="logo-container">
                    <img id="invoiceLogo" src="" alt="Logo" style="display:none;">
                </div>
                <div class="inv-title"><u>វិក្កយបត្រ (TAX INVOICE)</u></div>
            </div>

            <!-- ព័ត៌មានអតិថិជន និងវិក្កយបត្រ -->
            <div class="info-section">
                <div class="info-col">
                    <p><strong>អតិថិជន:</strong> <input type="text" id="custName" placeholder="ឈ្មោះអតិថិជន"></p>
                    <p><strong>ទូរស័ព្ទ:</strong> <input type="text" id="custPhone" placeholder="លេខទូរស័ព្ទ"></p>
                    <p><strong>អាសយដ្ឋាន:</strong> <input type="text" id="custAddr" placeholder="អាសយដ្ឋាន"></p>
                </div>
                <div class="info-col">
                    <p><strong>វិក្កយបត្រលេខ:</strong> <input type="text" id="invNo" placeholder="លេខរៀង"></p>
                    <p><strong>កាលបរិច្ឆេទ:</strong> <input type="date" id="dateInput"></p>
                </div>
            </div>

            <!-- តារាងទំនិញ -->
            <table class="inv-table">
                <thead>
                    <tr>
                        <th>លរ</th><th>បរិយាយ</th><th>បរិមាណ</th><th>តម្លៃ</th><th>តម្លៃសរុប</th>
                    </tr>
                </thead>
                <tbody id="invoiceTableBody"></tbody>
            </table>

            <!-- ផ្នែក QR Code និង សរុបទឹកប្រាក់ -->
            <div class="footer-section">
                <div class="qr-box">
                    <p>Scan Pay Here:</p>
                    <div id="qrPreview"></div>
                </div>
                <div class="totals-box">
                    <p>សរុប (Sub Total): <span id="subTotal">$ 0.00</span></p>
                    <p>បញ្ចុះតម្លៃ (Discount): <input type="number" id="discount" value="0" style="width:50px;"></p>
                    <p>អាករ (VAT 10%): <span id="vatAmount">$ 0.00</span></p>
                    <p style="font-weight:bold; font-size: 1.2em;">សរុបទាំងអស់ (Grand Total): <span id="grandTotal">$ 0.00</span></p>
                </div>
            </div>
        </div>
        
        <button onclick="window.print()" class="download-btn no-print">ទាញយកជា PDF</button>
    </div>
</body>
</html>
