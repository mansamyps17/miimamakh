<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Universal CAD & BIM Viewer (AutoCAD, Revit, Robot)</title>
    <!-- Autodesk Viewer SDK Styles & Engine -->
    <link rel="stylesheet" href="https://developer.api.autodesk.com/modelderivative/v2/viewers/7.*/style.min.css" type="text/css">
    <script src="https://developer.api.autodesk.com/modelderivative/v2/viewers/7.*/viewer3D.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #1e1e1e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        .toolbar {
            height: 52px;
            background: #252526;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            border-bottom: 1px solid #3c3c3c;
            z-index: 100;
            position: relative;
        }
        .left-controls { display: flex; align-items: center; gap: 8px; overflow: hidden; }
        .btn-back {
            color: #ccc;
            text-decoration: none;
            font-size: 12px;
            background: #333;
            padding: 6px 12px;
            border-radius: 4px;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .btn-back:hover { background: #444; color: #fff; }
        
        #status-pill {
            font-size: 11px;
            background: #111;
            padding: 5px 10px;
            border-radius: 20px;
            color: #00bcd4;
            border: 1px solid #333;
            white-space: nowrap;
            text-overflow: ellipsis;
            overflow: hidden;
            max-width: 140px;
        }
        
        .right-controls { display: flex; align-items: center; gap: 8px; }
        .btn-upload {
            background: #0e639c;
            color: #fff;
            border: none;
            font-size: 12px;
            font-weight: 600;
            padding: 7px 14px;
            border-radius: 4px;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.2s;
        }
        .btn-upload:hover { background: #1177bb; }
        .btn-upload:disabled { background: #444; cursor: not-allowed; }
        
        #viewerContainer {
            width: 100%;
            height: calc(100% - 52px);
            position: relative;
            background: #ffffff;
        }
    </style>
</head>
<body>

    <div class="toolbar">
        <div class="left-controls">
            <a href="index.html" class="btn-back">← ត្រឡប់ក្រោយ</a>
            <span id="status-pill">● រួចរាល់</span>
        </div>
        <div class="right-controls">
            <input type="file" id="cadFileInput" accept=".dwg,.dxf,.rvt,.rtd,.ifc,.nwd" style="display: none;">
            <button id="uploadBtn" class="btn-upload" onclick="document.getElementById('cadFileInput').click()">📂 បើកប្លង់</button>
        </div>
    </div>

    <div id="viewerContainer"></div>

    <script>
        const WORKER_URL = 'https://autodesk-token.mansamy-ps17.workers.dev';
        const BUCKET_KEY = 'miimama_cad_bucket_2026';
        let viewer = null;
        let globalToken = '';

        const statusPill = document.getElementById('status-pill');
        const uploadBtn = document.getElementById('uploadBtn');

        function setStatus(text, color = '#00bcd4') {
            statusPill.style.color = color;
            statusPill.innerHTML = `● ${text}`;
        }

        // ១. ទាញយក Token
        async function fetchAccessToken(onGetAccessToken) {
            try {
                const res = await fetch(WORKER_URL);
                const data = await res.json();
                if (data.access_token) {
                    globalToken = data.access_token;
                    if (onGetAccessToken) onGetAccessToken(data.access_token, data.expires_in);
                }
            } catch (err) {
                setStatus('កំហុស Token', '#ff5252');
            }
        }

        // ២. ចាប់ផ្ដើម Viewer Engine
        const initOptions = {
            env: 'AutodeskProduction2',
            api: 'streamingV2',
            getAccessToken: fetchAccessToken
        };

        Autodesk.Viewing.Initializer(initOptions, () => {
            const container = document.getElementById('viewerContainer');
            viewer = new Autodesk.Viewing.GuiViewer3D(container);
            viewer.start();
            setStatus('ម៉ាស៊ីនរួចរាល់', '#4caf50');
        });

        // ៣. Upload និង Translate ហ្វាល
        document.getElementById('cadFileInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            uploadBtn.disabled = true;
            setStatus(`Upload: ${file.name}...`);

            try {
                if (!globalToken) await fetchAccessToken();

                await fetch('https://developer.api.autodesk.com/oss/v2/buckets', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${globalToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ bucketKey: BUCKET_KEY, policyKey: 'transient' })
                });

                const safeName = encodeURIComponent(file.name);
                const s3InitRes = await fetch(`https://developer.api.autodesk.com/oss/v2/buckets/${BUCKET_KEY}/objects/${safeName}/signeds3upload`, {
                    headers: { 'Authorization': `Bearer ${globalToken}` }
                });
                const s3InitData = await s3InitRes.json();

                setStatus(`Upload (${(file.size / (1024 * 1024)).toFixed(1)} MB)...`);
                await fetch(s3InitData.urls[0], {
                    method: 'PUT',
                    body: file
                });

                const completeRes = await fetch(`https://developer.api.autodesk.com/oss/v2/buckets/${BUCKET_KEY}/objects/${safeName}/signeds3upload`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${globalToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ uploadKey: s3InitData.uploadKey })
                });
                const completeData = await completeRes.json();
                const urn = btoa(completeData.objectId).replace(/=/g, '');

                setStatus('កំពុងបម្លែង...');
                await fetch('https://developer.api.autodesk.com/modelderivative/v2/designdata/job', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${globalToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        input: { urn: urn },
                        output: { formats: [{ type: 'svf2', views: ['2d', '3d'] }] }
                    })
                });

                pollManifestStatus(urn);

            } catch (err) {
                setStatus('បរាជ័យ: ' + err.message, '#ff5252');
                uploadBtn.disabled = false;
            }
        });

        // ៤. តាមដាន Manifest
        function pollManifestStatus(urn) {
            const timer = setInterval(async () => {
                try {
                    const res = await fetch(`https://developer.api.autodesk.com/modelderivative/v2/designdata/${urn}/manifest`, {
                        headers: { 'Authorization': `Bearer ${globalToken}` }
                    });
                    const data = await res.json();
                    
                    setStatus(`បម្លែង: ${data.progress || '0%'}`);

                    if (data.status === 'success') {
                        clearInterval(timer);
                        setStatus('កំពុងបើកប្លង់...', '#4caf50');
                        loadModel(urn);
                        uploadBtn.disabled = false;
                    } else if (data.status === 'failed') {
                        clearInterval(timer);
                        setStatus('បម្លែងបរាជ័យ', '#ff5252');
                        uploadBtn.disabled = false;
                    }
                } catch (e) {
                    clearInterval(timer);
                    uploadBtn.disabled = false;
                }
            }, 3000);
        }

        // ៥. Load ប្លង់ និងកែតម្រូវ Lineweight & Selection លើទូរសព្ទ
        function loadModel(urn) {
            const documentId = 'urn:' + urn;
            Autodesk.Viewing.Document.load(documentId, (doc) => {
                const defaultModel = doc.getRoot().getDefaultGeometry();
                
                viewer.loadDocumentNode(doc, defaultModel).then(() => {
                    setStatus('ប្លង់រួចរាល់', '#4caf50');

                    // បិទកម្រាស់បន្ទាត់ (Lineweight) ដើម្បីកុំឱ្យរីកខ្មៅជាប់គ្នា
                    if (viewer.impl && viewer.impl.setDisplayLineWidth) {
                        viewer.impl.setDisplayLineWidth(false);
                    }
                    if (viewer.prefs) {
                        viewer.prefs.set('lineWeight', false);
                    }

                    // បិទស្រមោលក្រៅ (Ghosting) និងកំណត់ឱ្យរើសត្រឹមផ្នែកតូចៗ
                    viewer.setGhosting(false);
                    viewer.setSelectionMode(Autodesk.Viewing.SelectionMode.LEAF_NODES);

                    // ដោះការជ្រើសរើសស្វ័យប្រវត្តិកុំឱ្យជាប់ផ្ទាំងខៀវធំពេល Pan ឬ Zoom លើទូរសព្ទ
                    viewer.addEventListener(Autodesk.Viewing.SELECTION_CHANGED_EVENT, () => {
                        viewer.clearSelection();
                    });

                });
            }, (errorCode) => {
                setStatus('Error: ' + errorCode, '#ff5252');
            });
        }
    </script>
</body>
</html>
