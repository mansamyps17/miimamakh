<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autodesk Official CAD Viewer</title>
    <!-- Autodesk Viewer SDK Styles & Scripts -->
    <link rel="stylesheet" href="https://developer.api.autodesk.com/modelderivative/v2/viewers/7.*/style.min.css" type="text/css">
    <script src="https://developer.api.autodesk.com/modelderivative/v2/viewers/7.*/viewer3D.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #1a1a1a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .toolbar {
            height: 48px;
            background: #252526;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            border-bottom: 1px solid #3c3c3c;
            z-index: 10;
            position: relative;
        }
        .btn-back {
            color: #fff;
            text-decoration: none;
            font-size: 13px;
            background: #3a3d41;
            padding: 6px 14px;
            border-radius: 4px;
            transition: background 0.2s;
        }
        .btn-back:hover { background: #505357; }
        .title { color: #00bcd4; font-size: 14px; font-weight: 600; }
        #viewerContainer { width: 100%; height: calc(100% - 48px); position: relative; }
    </style>
</head>
<body>
    <div class="toolbar">
        <a href="index.html" class="btn-back">← ត្រឡប់ក្រោយ</a>
        <span class="title">Autodesk APS Engine (24/7 Active)</span>
    </div>

    <div id="viewerContainer"></div>

    <script>
        let viewer;

        // ទាញយក Token ដោយស្វ័យប្រវត្តិតាមរយៈ Cloudflare Worker
        function getAccessToken(onGetAccessToken) {
            fetch('https://autodesk-token.mansamy-ps17.workers.dev')
                .then(res => res.json())
                .then(data => {
                    if (data.access_token) {
                        onGetAccessToken(data.access_token, data.expires_in);
                    } else {
                        console.error('Token acquisition failed:', data);
                    }
                })
                .catch(err => console.error('Error fetching access token:', err));
        }

        const options = {
            env: 'AutodeskProduction2',
            api: 'streamingV2',
            getAccessToken: getAccessToken
        };

        // Initialize Autodesk Viewer Canvas & Tools
        Autodesk.Viewing.Initializer(options, () => {
            const htmlDiv = document.getElementById('viewerContainer');
            viewer = new Autodesk.Viewing.GuiViewer3D(htmlDiv);
            const startedCode = viewer.start();
            if (startedCode > 0) {
                console.error('Failed to create Viewer: WebGL not supported.');
                return;
            }
            console.log('Autodesk Viewer initialized successfully.');
        });
    </script>
</body>
</html>
